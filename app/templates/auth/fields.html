<label class="form-label">Nome<input class="form-control" name="nome" required minlength="2" maxlength="100" autocomplete="name" value="{{ request.form.get('nome','') }}"></label>
<label class="form-label">Usuário<input class="form-control" name="username" required minlength="3" maxlength="40" autocomplete="username" pattern="[a-zA-Z0-9_.\-]{3,40}" value="{{ request.form.get('username','') }}"></label>
<label class="form-label">E-mail<input class="form-control" name="email" type="email" required maxlength="254" autocomplete="email" value="{{ request.form.get('email','') }}"></label>
<label class="form-label">Senha (8 a 128 caracteres)<input class="form-control" name="password" type="password" required minlength="8" maxlength="128" autocomplete="new-password"></label>
