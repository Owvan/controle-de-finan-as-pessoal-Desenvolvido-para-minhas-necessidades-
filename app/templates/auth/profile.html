{% extends 'base.html' %}{% from 'macros.html' import tokens with context %}{% block content %}<section class="panel auth-card"><p class="eyebrow">MINHA CONTA</p><h1 class="h3">{{ g.user.nome }}</h1><p class="text-secondary">{{ g.user.email }} · {{ 'Administrador' if g.user.is_admin else 'Usuário' }}</p><h2 class="h5">Alterar senha</h2><form method="post">{{ tokens() }}<label class="form-label">Senha atual<input class="form-control" name="current_password" type="password" required maxlength="128" autocomplete="current-password"></label><label class="form-label">Nova senha<input class="form-control" name="password" type="password" required minlength="8" maxlength="128" autocomplete="new-password"></label><label class="form-label">Confirmar nova senha<input class="form-control" name="confirm_password" type="password" required minlength="8" maxlength="128" autocomplete="new-password"></label><button class="btn btn-primary mt-3">Salvar nova senha</button></form></section>{% endblock %}
